<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a7b 50%, #1e3a5f 100%);
            color: #e8f0f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Monaco', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 80px 60px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .message {
            color: #ff6b6b;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        
        .subtext {
            color: #b8cfe0;
            margin-bottom: 60px;
            font-size: 18px;
            line-height: 1.8;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .stat-box {
            background: rgba(126, 200, 227, 0.1);
            border: 1px solid rgba(126, 200, 227, 0.25);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .stat-box:hover {
            background: rgba(126, 200, 227, 0.15);
            border-color: rgba(126, 200, 227, 0.4);
            transform: translateY(-2px);
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #7ec8e3;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #b8cfe0;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .chart {
            margin: 32px 0;
            padding: 24px;
            background: rgba(126, 200, 227, 0.08);
            border-radius: 12px;
            text-align: center;
        }
        
        .chart-title {
            color: #7ec8e3;
            font-weight: 600;
            margin-bottom: 24px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .chart-bars {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            min-height: 160px;
        }
        
        .chart-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 50px;
        }
        
        .chart-label {
            color: #b8cfe0;
            font-weight: 500;
            font-size: 12px;
            order: 2;
        }
        
        .chart-fill {
            background: linear-gradient(180deg, #5ba3c4 0%, #7ec8e3 100%);
            width: 100%;
            min-height: 20px;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(94, 163, 196, 0.3);
            order: 1;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #5ba3c4 0%, #7ec8e3 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 16px 40px;
            font-family: inherit;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(94, 163, 196, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(94, 163, 196, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.secondary {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
        
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="message">
                Get YOUR ASS Back to Work
            </div>
            
            <div class="subtext">
                Take a breath. This site is blocked during your focus time.
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="todayCount">0</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalClicks">0</div>
                    <div class="stat-label">All Time</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="activeDays">0</div>
                    <div class="stat-label">Active Days</div>
                </div>
            </div>
            
            <div class="chart hidden" id="chartContainer">
                <div class="chart-title">Last 7 Days</div>
                <div id="chartContent"></div>
            </div>
            
            <div class="button-group">
                <button onclick="toggleChart()">📊 History</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'leechblock_stats';
        
        function getStats() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : { daily: {} };
        }
        
        function saveStats(stats) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
        }
        
        function getTodayKey() {
            const now = new Date();
            return now.toISOString().split('T')[0];
        }
        
        function trackBlock() {
            const stats = getStats();
            const today = getTodayKey();
            
            if (!stats.daily[today]) {
                stats.daily[today] = 0;
            }
            stats.daily[today]++;
            saveStats(stats);
            updateDisplay();
        }
        
        function updateDisplay() {
            const stats = getStats();
            const today = getTodayKey();
            const todayCount = stats.daily[today] || 0;
            const totalClicks = Object.values(stats.daily).reduce((a, b) => a + b, 0);
            const activeDays = Object.keys(stats.daily).length;
            
            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('totalClicks').textContent = totalClicks;
            document.getElementById('activeDays').textContent = activeDays;
        }
        
        function toggleChart() {
            const container = document.getElementById('chartContainer');
            if (container.classList.contains('hidden')) {
                renderChart();
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }
        
        function renderChart() {
            const stats = getStats();
            const daily = stats.daily;
            const sortedDates = Object.keys(daily).sort().slice(-7);
            const maxClicks = Math.max(...sortedDates.map(d => daily[d]), 1);
            
            const chartContent = document.getElementById('chartContent');
            chartContent.innerHTML = '';
            
            const barsContainer = document.createElement('div');
            barsContainer.className = 'chart-bars';
            
            sortedDates.forEach(date => {
                const clicks = daily[date];
                const percentage = (clicks / maxClicks) * 100;
                const shortDate = date.slice(5);
                
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.innerHTML = `
                    <div class="chart-fill" style="height: ${Math.max(percentage * 1.5, 20)}px">${clicks}</div>
                    <span class="chart-label">${shortDate}</span>
                `;
                barsContainer.appendChild(bar);
            });
            
            chartContent.appendChild(barsContainer);
        }
        
        function exportData() {
            const stats = getStats();
            const csvContent = [
                'Date,Blocks',
                ...Object.entries(stats.daily)
                    .sort()
                    .map(([date, count]) => `${date},${count}`)
            ].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `leechblock-stats-${getTodayKey()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            
            alert('Data exported to CSV');
        }
        
        function clearData() {
            if (confirm('Clear all tracking data? This cannot be undone.')) {
                localStorage.removeItem(STORAGE_KEY);
                updateDisplay();
                document.getElementById('chartContainer').classList.add('hidden');
                alert('Data cleared');
            }
        }
        
        trackBlock();
        updateDisplay();
    </script>
</body>
</html>
